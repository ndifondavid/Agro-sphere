<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AgroSphere | Messages</title><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"><style>body{background:#edf4ef;font-family:Arial,sans-serif}.shell{max-width:800px;margin:32px auto;padding:24px}.card{background:#fff;border:1px solid #dce9e0;border-radius:20px;padding:24px}.message{padding:12px 16px;border-radius:14px;background:#f2f8f3;margin:10px 0}.message-form{display:grid;gap:12px;margin-top:20px}input,textarea{padding:12px;border:1px solid #d8e1dc;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 16px;background:#0f6a4e;color:#fff;font-weight:700;cursor:pointer}a{color:#0f6a4e;font-weight:700}</style></head><body><main class="shell"><a href="{{ url_for('marketplace.browse') }}">Back to Marketplace</a><section class="card"><h1>Messages about {{ listing.crop_type }}</h1><p>Farmer: {{ listing.farmer.name }}</p>{% for message in messages %}<div class="message"><strong>{{ message.sender.name }}</strong><p>{{ message.content }}</p></div>{% else %}<p>No messages yet.</p>{% endfor %}<form class="message-form" method="POST"><input type="hidden" name="receiver_id" value="{{ listing.farmer_id }}"><textarea name="content" rows="4" placeholder="Write a message..." required></textarea><button class="btn" type="submit">Send Message</button></form></section></main></body></html>
