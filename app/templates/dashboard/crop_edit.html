<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Crop</title><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"><style>body{background:#edf4ef;font-family:Arial,sans-serif}.shell{max-width:760px;margin:48px auto;padding:28px;background:#fff;border-radius:24px;box-shadow:0 18px 48px rgba(14,72,52,.12)}form{display:grid;gap:16px}label{display:grid;gap:8px;color:#21473e;font-weight:700}input,textarea{border:1px solid #d8e1dc;border-radius:12px;padding:14px;font:inherit}textarea{resize:vertical}.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;text-decoration:none;cursor:pointer}.primary{background:#0f6a4e;color:#fff}.secondary{background:#edf5ef;color:#0d5f43}</style></head>
<body class="standalone-page">{% include 'partials/sidebar.html' %}<main class="shell"><a href="{{ url_for('farm.manage_farm', farm_id=farm.id) }}" class="btn secondary">Back to Manage Farm</a><h1>Edit {{ crop.crop_type }}</h1><p>Update the crop details and replace its image if needed.</p><form method="POST" enctype="multipart/form-data"><label>Crop Type<input name="crop_type" value="{{ crop.crop_type }}" required></label><label>Variety<input name="variety" value="{{ crop.variety or '' }}"></label><label>Planting Date<input type="date" name="planting_date" value="{{ crop.planting_date.isoformat() if crop.planting_date else '' }}"></label><label>Description<textarea name="description" rows="6">{{ crop.description or '' }}</textarea></label><label>Replace Photo<input type="file" name="photo" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"></label><div class="actions"><a href="{{ url_for('farm.manage_farm', farm_id=farm.id) }}" class="btn secondary">Cancel</a><button class="btn primary" type="submit">Save Crop</button></div></form></main></body></html>
