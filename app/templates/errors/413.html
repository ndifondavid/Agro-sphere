<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSphere | Image Too Large</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
    <style>
      body { min-height:100vh; display:grid; place-items:center; margin:0; padding:24px; background:#edf4ef; font-family:Arial,sans-serif; color:#143a2d; }
      .message { width:min(560px,100%); padding:32px; text-align:center; background:#fff; border-radius:24px; box-shadow:0 18px 48px rgba(14,72,52,.12); }
      h1 { margin:0 0 10px; }
      p { color:#5d6e6a; line-height:1.6; }
      a { display:inline-flex; padding:12px 18px; border-radius:12px; background:#0f6a4e; color:#fff; text-decoration:none; font-weight:700; }
    </style>
  </head>
  <body>
    <main class="message">
      <h1>That image is too large</h1>
      <p>Please choose an image smaller than 16 MB and try adding the crop again.</p>
      <a href="{{ url_for('farm.list_farms') }}">Back to Farms</a>
    </main>
  </body>
</html>
