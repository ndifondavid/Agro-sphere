<aside class="sidebar persistent-sidebar" aria-label="Sidebar navigation">
  {% if current_user.is_authenticated and current_user.is_buyer() %}
    <nav class="menu">
      <a href="{{ url_for('marketplace.buyer_dashboard') }}" class="menu-item{% if request.endpoint == 'marketplace.buyer_dashboard' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 12.2 12 5l7.5 7.2M7 10.8V19h10v-8.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Dashboard
      </a>
      <a href="{{ url_for('marketplace.browse') }}" class="menu-item{% if request.endpoint == 'marketplace.browse' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5 12 3l9 5.5V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M3 9.5h18M9 13h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Marketplace
      </a>
      <a href="{{ url_for('marketplace.orders') }}" class="menu-item{% if request.endpoint == 'marketplace.orders' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M7 4h10l2 3v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7l2-3Zm0 4h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Orders
      </a>
      <a href="{{ url_for('marketplace.cart') }}" class="menu-item{% if request.endpoint == 'marketplace.cart' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 4h2l2.5 10.3a2 2 0 0 0 2 1.7h8.9a2 2 0 0 0 2-1.6L20 7H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="18.5" r="1.3" fill="currentColor"/><circle cx="17" cy="18.5" r="1.3" fill="currentColor"/></svg></span>
        Cart
      </a>
      <a href="{{ url_for('marketplace.wishlist') }}" class="menu-item{% if request.endpoint == 'marketplace.wishlist' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 20.5s-7.5-4.4-9.2-8.2A5.2 5.2 0 0 1 12 5.5a5.2 5.2 0 0 1 9.2 6.8C19.5 16.1 12 20.5 12 20.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        Wishlist
      </a>
      <a href="{{ url_for('marketplace.messages') }}" class="menu-item{% if request.endpoint == 'marketplace.messages' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 6.5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-7l-4 3v-3H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>

        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5m6 0a3 3 0 0 1-6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Notifications
      </a>
      <a href="{{ url_for('marketplace.profile') }}" class="menu-item{% if request.endpoint == 'marketplace.profile' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 12.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm-8 7a8 8 0 1 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Profile
      </a>
      <a href="{{ url_for('marketplace.buyer_help') }}" class="menu-item{% if request.endpoint == 'marketplace.buyer_help' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.1 9.2a3 3 0 1 1 5.8 1.4c-.9 1.4-2.8 1.9-3.8 3.3-.4.6-.4 1.1-.4 1.9M12 17.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Help &amp; Support
      </a>
    </nav>
    <div class="plan-box">
      <a class="logout-btn" href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  {% else %}
    <nav class="menu">
      <a href="{{ url_for('dashboard.index') }}" class="menu-item{% if request.endpoint == 'dashboard.index' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4.5 12.2 12 5l7.5 7.2M7 10.8V19h10v-8.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Overview
      </a>
      <a href="{{ url_for('farm.list_farms') }}" class="menu-item{% if request.endpoint in ['farm.list_farms', 'farm.create_farm', 'farm.farm_details', 'farm.manage_farm', 'farm.edit_crop', 'farm.create_crop'] %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M3 10.5 12 3l9 7.5V19a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        Farms
      </a>
      <a href="{{ url_for('scan.scan_leaf') }}" class="menu-item{% if request.endpoint and request.endpoint.startswith('scan.') %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 7.5h16M4 12h8m-8 4.5h12M18 12.5l2.5 2.5m-2.5 0 2.5-2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Scan
      </a>
      <a href="{{ url_for('community.index') }}" class="menu-item{% if request.endpoint and request.endpoint.startswith('community.') %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M5 6.5h14a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-7l-4 3v-3H5a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></span>
        Community
      </a>
      <a href="{{ url_for('dashboard.settings') }}" class="menu-item{% if request.endpoint == 'dashboard.settings' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v4m0 10v4m9-9h-4M7 12H3m16.2 6.2-2.8-2.8M9.6 9.6 6.8 6.8m0 10.4 2.8-2.8m6.8-6.8-2.8 2.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Settings
      </a>
      <a href="{{ url_for('dashboard.help_page') }}" class="menu-item{% if request.endpoint == 'dashboard.help_page' %} active{% endif %}">
        <span class="menu-icon"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.1 9.2a3 3 0 1 1 5.8 1.4c-.9 1.4-2.8 1.9-3.8 3.3-.4.6-.4 1.1-.4 1.9M12 17.5h.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        Help
      </a>
    </nav>
    <div class="plan-box">
      <span>Plan: Pro • 45 farms</span>
      <a class="plan-upgrade-link" href="{{ url_for('dashboard.upgrade') }}">Upgrade</a>
      <a class="logout-btn" href="{{ url_for('auth.logout') }}">Log out</a>
    </div>
  {% endif %}
</aside>
