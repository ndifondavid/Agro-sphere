<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSphere | List Crop to Market</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
  </head>
  <body class="dashboard-body market-body">
    <div class="dashboard-shell market-listing-shell">
      <header class="topbar market-topbar">
        <div class="brand" aria-label="AgroSphere brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <path d="M31.8 7.5c5.8 7.3 4 16.8-2.3 22.3-4.8 4.2-10.4 6.1-14.2 10.5-4.8 5.8-4.7 15.2 1.4 20.4 7.3 6.1 18.5 5.1 24.7-2.4 6.1-7.3 5.9-17.4 1.2-24.4C37.3 25.9 31.6 17.6 31.8 7.5Z" fill="rgba(255,255,255,0.18)"/>
              <path d="M32 8c3.3 4.9 2.3 10.8-1.8 15.1-4.2 4.4-10.1 6.1-15.6 9.3-5.8 3.5-9.1 9.8-8.7 16.3.4 7.2 6.3 13.1 13.5 13.1 7.7 0 13.8-6.1 13.8-13.8 0-9.4-7.7-16.8-13.5-19.5C22.3 23.8 17.7 18.5 17.7 12.8c0-1.7.3-3.3.9-4.8 2 3.2 5 5.6 8.6 7.1 4.7 1.9 10.1 2.2 14.3.7L32 8Z" fill="#E8FFF2"/>
              <path d="M41.8 19.8c5.7 1.8 8.7 7.7 7.6 13.4-1 5.4-5.9 9.7-11.6 10-4.7.2-9.4-2.1-11.5-6.1-2.7-5.1-1.7-12.1 3.2-15.8 3.1-2.4 7.6-3 12.3-1.5Z" fill="#D9F9E7"/>
              <path d="M22.4 23.2c2.8-4 7.3-6.6 12.3-7.3" stroke="#0E6B4E" stroke-width="3" stroke-linecap="round"/>
              <path d="M19.5 35.2c7.5-3.3 15.9-3.3 23.3 0" stroke="#0E6B4E" stroke-width="3" stroke-linecap="round"/>
              <path d="M26.3 46.8c5.4 4.5 12.2 4.6 17.7 0" stroke="#0E6B4E" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-title">AgroSphere</span>
          </div>
        </div>
        <a href="{{ url_for('farm.list_farms') }}" class="close-button" aria-label="Close">×</a>
      </header>

      <main class="market-form-wrap">
        <div class="market-form-header">
          <h1>List Crop to Market</h1>
        </div>
        <p class="market-form-subtitle">Select the crop from your farm to list it on the marketplace.</p>

        <form method="post" class="listing-form">
          <div class="field-block">
            <label for="farm_id">Select Farm</label>
            <select id="farm_id" name="farm_id" required>
              {% for farm in farms %}
                <option value="{{ farm.id }}">{{ farm.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="field-block">
            <label for="crop_id">Select Crop</label>
            <select id="crop_id" name="crop_id" required>
              {% for farm in farms %}
                {% for crop in farm.crops %}
                  <option value="{{ crop.id }}">{{ crop.crop_type }}</option>
                {% endfor %}
              {% endfor %}
            </select>
          </div>

          <div class="field-row two-up">
            <div class="field-block">
              <label for="quantity">Quantity (kg)</label>
              <input id="quantity" name="quantity" type="number" min="1" step="0.1" placeholder="120" required />
            </div>
            <div class="field-block">
              <label for="price">Price (FCFA)</label>
              <input id="price" name="price" type="number" min="1" step="1" placeholder="500" required />
            </div>
          </div>

          <div class="field-row two-up">
            <div class="field-block">
              <label for="harvest_date">Harvest date</label>
              <input id="harvest_date" name="harvest_date" type="date" required />
            </div>
            <div class="field-block">
              <label>Condition</label>
              <div class="condition-box">
                <span class="condition-chip">Healthy</span>
                <strong>— 95%</strong>
              </div>
            </div>
          </div>

          <div class="field-block upload-box">
            <label for="image_path">Upload photos</label>
            <input id="image_path" name="image_path" type="text" placeholder="Optional photo reference" />
          </div>

          <div class="alert-banner">
            <span class="alert-icon">i</span>
            <div>
              <strong>Only healthy crops can be listed</strong>
              <p>Crops with condition below 95% health cannot be listed for market sale.</p>
            </div>
          </div>

          <div class="form-actions">
            <a href="{{ url_for('farm.list_farms') }}" class="cancel-btn">Cancel</a>
            <button type="submit" class="primary-market-btn">List to Market</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
