<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgroSphere | Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body class="auth-body">
    <main class="auth-shell">
      <section class="auth-card" aria-label="Register form">
        <aside class="auth-intro">
          <div class="intro-badge">AgroSphere</div>
          <h2>Create account</h2>
          <p>Join farmers, buyers, and agribusiness partners in one smart agricultural network.</p>
        </aside>

        <div class="auth-panel">
          <div class="auth-back-row">
            <a class="back-link" href="{{ url_for('public.landing') }}">Back</a>
          </div>

          <nav class="auth-tabs" aria-label="Authentication tabs">
            <div class="tab-bar">
              <a class="tab" href="{{ url_for('auth.login') }}">Login</a>
              <a class="tab tab--active" href="{{ url_for('auth.register') }}">Register</a>
            </div>
          </nav>

          <form class="auth-form" method="POST" action="{{ url_for('auth.register') }}">
            <h2 class="form-title">Sign up</h2>
            <div class="field-row">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 21a8 8 0 10-16 0"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <div class="field-box">
                <label for="name">User name</label>
                <input id="name" name="name" type="text" placeholder="Enter your name" required />
              </div>
            </div>

            <div class="field-row">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 6h16v12H4z"></path>
                  <path d="M4 8l8 6 8-6"></path>
                </svg>
              </span>
              <div class="field-box">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter your email" required />
              </div>
            </div>

            <div class="field-row">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                  <path d="M7 11V7a5 5 0 0110 0v4"></path>
                </svg>
              </span>
              <div class="field-box">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required />
              </div>
            </div>

            <div class="field-row field-row--role">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 00-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 010 7.75"></path>
                </svg>
              </span>
              <div class="field-box field-box--role">
                <label>Role / User Type</label>
                <div class="role-options">
                  <label class="role-option"><input type="radio" name="role" value="farmer" checked /> <span>Farmer</span></label>
                  <label class="role-option"><input type="radio" name="role" value="buyer" /> <span>Buyer</span></label>
                </div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="primary-btn">Register</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
