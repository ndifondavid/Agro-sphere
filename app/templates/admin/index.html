<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AgroSphere | Admin</title><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"><style>body{background:#edf4ef;font-family:Arial,sans-serif}.shell{max-width:1100px;margin:32px auto;padding:28px}.header,.stats{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}.header h1{color:#143a2d}.stat,.table{background:#fff;border:1px solid #dce9e0;border-radius:16px;padding:18px}.stat{min-width:180px;flex:1}.stat strong{display:block;font-size:2rem;color:#0f6a4e}.table{margin-top:20px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e5eee8}a{color:#0f6a4e;font-weight:700}</style></head><body><main class="shell"><div class="header"><div><a href="{{ url_for('public.landing') }}">AgroSphere</a><h1>Admin Overview</h1></div><a href="{{ url_for('auth.logout') }}">Log out</a></div><div class="stats"><div class="stat">Users<strong>{{ users|length }}</strong></div><div class="stat">Farms<strong>{{ farm_count }}</strong></div><div class="stat">Listings<strong>{{ listing_count }}</strong></div></div><section class="table"><h2>Recent Accounts</h2><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>{% for user in users[:20] %}<tr><td>{{ user.name }}</td><td>{{ user.email }}</td><td>{{ user.role }}</td></tr>{% else %}<tr><td colspan="3">No accounts yet.</td></tr>{% endfor %}</tbody></table></section></main></body></html>
