<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}AgroSphere{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}" />
    {% block head %}{% endblock %}
  </head>
  <body class="dashboard-body {% block body_class %}{% endblock %}">
    <div class="dashboard-shell">
      <header class="topbar">
        <div class="brand" aria-label="AgroSphere brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="{{ url_for('static', filename='images/as-logo.svg') }}" alt="AgroSphere logo" class="brand-mark-image" />
          </div>
          <div class="brand-text">
            <span class="brand-title">AgroSphere</span>
            <small>Smart Plant Disease Detection Platform</small>
          </div>
        </div>

        {% include 'partials/top_actions.html' %}
      </header>

      <div class="content-grid">
        {% include 'partials/sidebar.html' %}
        {% block content %}{% endblock %}
      </div>
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
